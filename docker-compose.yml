
services:

  volume-init:
    image: alpine:3.21
    user: "0:0"
    command: >
      sh -c "chown -R 1000:1000 /data"
    volumes:
      - sqlite_data:/data
    restart: "no"


  backend:
    
    depends_on:
      volume-init:
        condition: service_completed_successfully

    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: sqlite:////data/app.db
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      ENABLE_FAILURE_SIMULATION: "true"

    volumes:
      - sqlite_data:/data

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  sqlite_data:
